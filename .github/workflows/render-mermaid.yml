name: Render Mermaid diagrams

on:
  push:
    paths:
      - "**/*.mmd"
      - ".github/workflows/render-mermaid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_REF_NAME}"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid files to PNG
        run: |
          find . -name "*.mmd" -print0 | while IFS= read -r -d '' file; do
            output="${file%.mmd}.png"
            echo "Rendering $file -> $output"
            mmdc -p puppeteer-config.json -i "$file" -o "$output" -b white
          done

      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*.png'
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Render Mermaid diagrams"
            git push origin "${GITHUB_REF_NAME}"
          fi
