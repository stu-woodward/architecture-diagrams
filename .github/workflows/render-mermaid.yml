name: Render Mermaid diagrams

on:
  push:
    paths:
      - "**/*.mmd"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid files to PNG
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: |
          find . -name "*.mmd" -print0 | while IFS= read -r -d '' file; do
            output="${file%.mmd}.png"
            echo "Rendering $file -> $output"
            mmdc -i "$file" -o "$output" -b white
          done

      - name: Commit generated PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render Mermaid diagrams"
          file_pattern: "**/*.png"
