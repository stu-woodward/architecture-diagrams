name: Render Mermaid diagrams

on:
  push:
    paths:
      - "**/*.mmd"
      - ".github/workflows/render-mermaid.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid files to PNG
        run: |
          find . -name "*.mmd" -print0 | while IFS= read -r -d '' file; do
            output="${file%.mmd}.png"
            echo "Rendering $file -> $output"
            mmdc -p puppeteer-config.json -i "$file" -o "$output" -b white
          done

      - name: Commit generated PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render Mermaid diagrams"
          file_pattern: "**/*.png"
